name: Publish temporary video files
on:
  workflow_dispatch:
    inputs:
      build_commit:
        description: 'Internal dispatch: exact unique main commit; leave empty for a new deployment'
        type: string
  release:
    types: [published, deleted]
permissions:
  contents: read
concurrency:
  group: media-pages
  cancel-in-progress: false
jobs:
  request-deployment:
    if: >-
      github.repository == 'nitinsharma47-ux/parv-ki-dhun-media' && github.event.repository.private == false
      && ((github.event_name == 'release' && startsWith(github.event.release.tag_name, 'media-'))
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.build_commit == ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: write
      actions: write
    steps:
      # Pages uses GITHUB_SHA as its build ID. Give each new inventory a unique
      # main commit before dispatch; even repeated manual runs can serve stale bytes.
      - name: Request a deployment from main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_REQUEST: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/publish_deployment.py?ref=main" --jq .content | base64 --decode > "$RUNNER_TEMP/publish_deployment.py"
          python3 "$RUNNER_TEMP/publish_deployment.py"
  site:
    if: >-
      github.repository == 'nitinsharma47-ux/parv-ki-dhun-media' && github.event.repository.private == false
      && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      && inputs.build_commit == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Build the site from hash-verified public media assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 build_site.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public
          retention-days: 1
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
      - name: Verify the served inventory and every video
        run: python3 verify_site.py
